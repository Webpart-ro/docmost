name: Webpart image

# Builds the Docmost image from this fork (community/AGPL build: the private `ee`
# submodule is intentionally not checked out). PRs to `webpart` only build;
# pushes to `webpart` publish ghcr.io/webpart-ro/docmost:{sha,latest}.

on:
  pull_request:
    branches: [webpart]
  push:
    branches: [webpart]
  workflow_dispatch:

concurrency:
  group: webpart-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/webpart-ro/docmost

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install pnpm
        run: npm install -g pnpm@11.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vikunja login tests
        working-directory: apps/server
        run: pnpm exec jest src/core/auth/vikunja

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/webpart' }}

      - name: Build (and push on webpart)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=webpart-amd64
          cache-to: type=gha,scope=webpart-amd64,mode=max
